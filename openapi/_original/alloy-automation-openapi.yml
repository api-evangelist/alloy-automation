                            retry,
                            trigger,
                            webhook,
                          ]
                        example: "cli"
                      executionUuid:
                        type: string
                        example: "35SnGU0DUSNP5L26fsmnq"
                      workflowId:
                        type: string
                        example: "67ef01ed8eaeb50b18e646ea"
                      userId:
                        type: string
                        example: "67a21c7d10e1dee8d5ec3a3d"
                      forgeWorkflowId:
                        type: string
                        example: "67ef017d8eaeb50b18e635a1"
                      finished:
                        type: boolean
                        example: true
                      retries:
                        type: array
                        items: {}
                        example: []
                      actions:
                        type: integer
                        example: 3
                      metadata:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "Step Name"
