openapi: 3.0.1
info:
  title: Embedded 2025-09
  version: "5.0"
servers:
  - url: https://production.runalloy.com
components:
  parameters:
    xApiVersion:
      name: x-api-version
      in: header
      required: true
      description: The version of the API to use. The current API version is **2025-09**.
      schema:
        type: string
        default: "2025-09"
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
paths:
  /users/{userId}:
    put:
      summary: Update a user
      description: >-
        Updates a user given a specified userId. This endpoint allows you to
        update a username or fullName and returns the updated user object.
      operationId: update-a-user
      parameters:
        - name: userId
          in: path
          description: >-
            The Id of the user you want to lookup. Returned from the Create User
            endpoint. Note: you can also use the Embedded user's `username` in
            this field.
          schema:
            type: string
          required: true
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The unique identifier of the user
                fullName:
                  type: string
                  description: The name of the user
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    userId: "6323d7c9122ae69742a5d0a2"
                    fullName: "Gregg Mojica"
                    username: "greggmojica"
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: 6323d7c9122ae69742a5d0a2
                  fullName:
                    type: string
                    example: Gregg Mojica
                  username:
                    type: string
                    example: greggmojica
        "401":
          description: "401"
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: "Unauthorized"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
      deprecated: false
      security: []
    get:
      summary: Retrieve a single user
      description: >-
        Returns a specific user given a userId and any active workflows
        associated with the user.
      operationId: get-a-user
      parameters:
        - name: userId
          in: path
          description: >-
            The Id of the user you want to lookup. Returned from the Create User
            endpoint. Note: you can also use the Embedded user's `username` in
            this field.
          schema:
            type: string
          required: true
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: "6323d7c9122ae69742a5d0a2"
                  fullName:
                    type: string
                    example: "Gregg Mojica"
                  username:
                    type: string
                    example: "support@runalloy.com"
                required:
                  - userId
                  - fullName
                  - username
              examples:
                Result:
                  value:
                    userId: "6323d7c9122ae69742a5d0a2"
                    fullName: "Gregg Mojica"
                    username: "support@runalloy.com"
      deprecated: false
      security: []
    delete:
      summary: Delete a user
      description: >-
        This endpoint deletes a user account. It is most commonly used when a
        user stops being a customer of your platform or in conjunction with a
        GDPR compliance request. Note that this endpoint only deletes the user's
        account – not any corresponding workflow logs or other data. To remove
        that data as part of a compliance request, see our 'Delete User Logs'
        endpoint
      operationId: delete-a-user
      parameters:
        - name: userId
          in: path
          description: >-
            The Id of the user you want to lookup. Returned from the Create User
            endpoint. Note: you can also use the Embedded user's `username` in
            this field.
          schema:
            type: string
          required: true
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
        "401":
          description: "401"
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: "Unauthorized"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
      deprecated: false
      security: []
  /users/:
    post:
      summary: Create a user
      description: >-
        Creates a new user in your Embedded account. The user record acts like a
        "container" to store all the integrations, workflows, and credentials
        for any given user. Returns a user identifier.
      operationId: create-a-user
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                fullName:
                  type: string
                  description: >-
                    The name of the user you want to create. Typically a full
                    name.
                username:
                  type: string
                  description: >-
                    The username to be associated with the user.  To easily
                    identify a customer, we recommend using a friendly username
                    such as an email for example. The username must be unique
                    (this acts as an identifier to reference and lookup a given
                    merchant on your platform).
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    userId: "xyz123abc098754"
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: xyz123abc098754
        "401":
          description: "401"
          content:
            application/json:
              examples:
                Result:
                  value: "{}"
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
  /users:
    get:
      summary: Retrieve a list of all users
      description: Returns a list of all users created in your Embedded account.
      operationId: list-all-users
      parameters:
        - name: parentWorkflowId
          in: query
          description: >-
            You can pass a parentWorkflowId if you wish to list users for a
            specific workflow.
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                      - userId: "6323d7c9122ae69742a5d0a2"
                        username: "gregg"
                        fullName: "Gregg Mojica"
                      - userId: "6323d7cf9ae88f59bf66ce63"
                        username: "sara"
                        fullName: "Sara Du"
                      - userId: "6323d7e159479ba26d80fcc8"
                        fullName: "William Jackson"
                      - userId: "6323d7f090020baf1091b151"
                        username: "izzy@gmail.com"
                        fullName: "Izzy Jackson"
                      - userId: "6323d7da4b764bfe02cacaef"
                        username: "jose@example.com"
                        fullName: "Jose Santos"
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          example: 6323d7c9122ae69742a5d0a2
                        username:
                          type: string
                          example: gregg
                        fullName:
                          type: string
                          example: Gregg Mojica
        "401":
          description: "401"
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: "Unauthorized"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
      deprecated: false
      security: []
  /headless/credentials:
    post:
      summary: Create Credential
      description: >-
        Use this endpoint to add a credential programmatically via the API. This
        endpoint should be used primarily for non-OAuth blocks. If you are using
        custom OAuth with an OAuth block and you have the OAuth tokens
        already, you can add them to Alloy with this endpoint. Please reference
        [this](/embedded/headless-mode) section of our docs for
        a complete tutorial on when and how to use this endpoint.
      operationId: create-a-credential
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
                - userId
              properties:
                credential:
                  type: object
                  description: The data for the credential you want to create.
                  properties:
                    type:
                      type: string
                      description: Connector name, e.g., "netsuite".
                    data:
                      type: object
                      description: Connector authentication required parameters.
                      properties:
                        realm:
                          type: string
                        consumerKey:
                          type: string
                        tokenId:
                          type: string
                        tokenSecret:
                          type: string
                userId:
                  type: string
                  description: The id of the currently logged in user
            examples:
              Request Example:
                value:
                  userId: string
                  credential:
                    type: netsuite
                    data:
                      realm: XXX
                      consumerKey: XXX
                      tokenId: XXX
                      tokenSecret: XXX
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: true
                    credentialId: "63252d14cc29df15cc481a76"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  credentialId:
                    type: string
                    example: 63252d14cc29df15cc481a76
      deprecated: false
      security: []
  /metadata/credentials:
    get:
      summary: Retrieve all credential structures
      description: >-
        This endpoint returns a basic structure of what data must be inputted
        when adding a credential manually. This should be used when creating a
        credential using the POST credential endpoint.


        This endpoint returns the structure of every supported block on Alloy
        Embedded. It returns a boolean flag called `isOauth` which indicates if
        the credential uses OAuth or an API key.
      operationId: get-credential-metadata
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                      - connector: "acuityScheduling"
                        icon: "https://cdn.runalloy.com/icons/acuityScheduling.png"
                        isOauth: false
                        properties:
                          - name: "apiKey"
                            displayName: "API Key"
                          - name: "userId"
                            displayName: "User Id"
                      - connector: "amazonBusiness"
                        icon: "https://cdn.runalloy.com/icons/amazonBusiness.png"
                        isOauth: true
                        properties:
                          - name: "regionCountry"
                            displayName: "Country"
                            description: ""
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        connector:
                          type: string
                          example: acuityScheduling
                        icon:
                          type: string
                          example: https://cdn.runalloy.com/icons/acuityScheduling.png
                        isOauth:
                          type: boolean
                          example: false
                          default: true
                        properties:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: apiKey
                              displayName:
                                type: string
                                example: API Key
      deprecated: false
      security: []
  /users/{userId}/token:
    get:
      summary: Generate a new JWT for a user
      description: >-
        This endpoint is used to generate a new user token in the form of a JSON
        Web Token (JWT) which is required to securely render the Embedded Modal
        in your application. Once retrieved, you'll want to pass this token to
        your frontend.
      operationId: generate-jwt-token
      parameters:
        - name: userId
          in: query
          description: >-
            The Id of the user you want to lookup. Returned from the Create User
            endpoint. Note: you can also use the Embedded user's `username` in
            this field.
          schema:
            type: string
          required: true
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      x-code-samples:
        - lang: cURL
          source: |
            curl -X GET "https://production.runalloy.com/users/{userId}/token?userId={{userId}}" \
              -H "Authorization: bearer YOUR_API_KEY" \
              -H "x-api-version: 2025-09"
        - lang: Python
          source: |
            import requests

            url = "https://production.runalloy.com/users/{userId}/token"
            params = {"userId": "{{userId}}"}
            headers = {
                "Authorization": "bearer YOUR_API_KEY",
                "x-api-version": "2025-09"
            }

            response = requests.get(url, params=params, headers=headers)
            print(response.json())
        - lang: JavaScript
          source: |
            const userId = "{{userId}}";
            const url = `https://production.runalloy.com/users/${userId}/token?userId=${userId}`;

            fetch(url, {
              method: "GET",
              headers: {
                "Authorization": "bearer YOUR_API_KEY",
                "x-api-version": "2025-09"
              }
            })
              .then(response => response.json())
              .then(data => console.log(data))
              .catch(error => console.error("Error:", error));
        - lang: PHP
          source: |
            <?php
            $userId = "{{userId}}";
            $url = "https://production.runalloy.com/users/{$userId}/token?userId=" . urlencode($userId);
            
            $ch = curl_init($url);
            curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
            curl_setopt($ch, CURLOPT_HTTPHEADER, [
                "Authorization: bearer YOUR_API_KEY",
                "x-api-version: 2025-09"
            ]);
            
            $response = curl_exec($ch);
            curl_close($ch);
            $data = json_decode($response, true);
            print_r($data);
            ?>
        - lang: Go
          source: |
            package main

            import (
                "encoding/json"
                "fmt"
                "io"
                "net/http"
                "net/url"
            )

            func main() {
                userId := "{{userId}}"
                baseURL := "https://production.runalloy.com/users/" + userId + "/token"
                params := url.Values{}
                params.Add("userId", userId)
                fullURL := baseURL + "?" + params.Encode()

                req, _ := http.NewRequest("GET", fullURL, nil)
                req.Header.Set("Authorization", "bearer YOUR_API_KEY")
                req.Header.Set("x-api-version", "2025-09")

                client := &http.Client{}
                resp, _ := client.Do(req)
                defer resp.Body.Close()

                body, _ := io.ReadAll(resp.Body)
                var data map[string]interface{}
                json.Unmarshal(body, &data)
                fmt.Println(data)
            }
        - lang: Java
          source: |
            import java.net.HttpURLConnection;
            import java.net.URL;
            import java.io.BufferedReader;
            import java.io.InputStreamReader;
            import com.google.gson.Gson;
            import java.util.Map;

            public class Example {
                public static void main(String[] args) throws Exception {
                    String userId = "{{userId}}";
                    String baseUrl = "https://production.runalloy.com/users/" + userId + "/token";
                    String urlString = baseUrl + "?userId=" + java.net.URLEncoder.encode(userId, "UTF-8");
                    
                    URL url = new URL(urlString);
                    HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                    conn.setRequestMethod("GET");
                    conn.setRequestProperty("Authorization", "bearer YOUR_API_KEY");
                    conn.setRequestProperty("x-api-version", "2025-09");
                    
                    BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                    String inputLine;
                    StringBuilder response = new StringBuilder();
                    while ((inputLine = in.readLine()) != null) {
                        response.append(inputLine);
                    }
                    in.close();
                    
                    Gson gson = new Gson();
                    Map<String, Object> data = gson.fromJson(response.toString(), Map.class);
                    System.out.println(data);
                }
            }
        - lang: Ruby
          source: |
            require 'net/http'
            require 'json'
            require 'uri'

            userId = "{{userId}}"
            base_url = "https://production.runalloy.com/users/#{userId}/token"
            uri = URI(base_url)
            params = { userId: userId }
            uri.query = URI.encode_www_form(params)

            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true

            request = Net::HTTP::Get.new(uri)
            request['Authorization'] = 'bearer YOUR_API_KEY'
            request['x-api-version'] = '2025-09'

            response = http.request(request)
            data = JSON.parse(response.body)
            puts data
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    token: "XXXXXXXXXXXXXX.YYYYYYYYYYYYYY.ZZZZZZZZZZZZZZ"
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: XXXXXXXXXXXXXX.YYYYYYYYYYYYYY.ZZZZZZZZZZZZZZ
      deprecated: false
      security: []
  /credentials/users/{userId}:
    get:
      summary: Retrieve all credentials for a user
      description: Returns a list of all credentials created for a specified user.
      operationId: list-user-credentials
      parameters:
        - name: userId
          in: path
          description: The id of the currently logged in user
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                      - credentialId: "66fb066c3793749b64c214bc"
                        type: "shopify"
                        name: "Shopify alloy-sandbox.myshopify.com"
                        createdAt: "2024-09-30T20:13:32.491Z"
                        updatedAt: "2024-09-30T20:13:32.522Z"
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        credentialId:
                          type: string
                          example: 63253068590a5f1d6cc9b635
                        type:
                          type: string
                          example: shopify
                        createdAt:
                          type: string
                          example: "2022-09-17T02:12:25.619Z"
                        updatedAt:
                          type: string
                          example: "2022-09-17T02:12:25.620Z"
      deprecated: false
      security: []
  /workflows/install:
    post:
      summary: Install workflows
      description: >-
        Installs workflows for a specified user.
      operationId: install-workflows
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - workflowIds
                - credentialIds
                - userId
              properties:
                workflowIds:
                  type: array
                  items:
                    type: string
                credentialIds:
                  type: array
                  items:
                    type: string
                userId:
                  type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value:
                    installed: true
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                    example: true
                    default: true
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: "Could not install workflow(s)"
      deprecated: false
      security: []
  /workflows:
    get:
      summary: Retrieve a list of workflows
      description: >-
        Returns a list of all active **parent** workflows associated with your
        Alloy Embedded account. Note this endpoint does _not_ return a list of
        workflows that the user has installed, but rather a list of all
        _available_ workflows. The `installed` flag indicates if the user has
        installed a copy of the workflow but does not  indicate if the user has
        a given workflow "active".


        For each workflow, this endpoint returns the individual apps that are
        required as part of the workflow. Commonly used to populate data on an
        integrations page.
      operationId: list-workflows
      parameters:
        - name: userId
          in: query
          description: >-
            The Id of the user you want to lookup. Returned from the Create User
            endpoint. Note: you can also use the Embedded user's `username` in
            this field.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - $ref: "#/components/parameters/xApiVersion" # Reference the global parameter
      x-code-samples:
        - lang: cURL
          source: |
            curl -X GET "https://production.runalloy.com/workflows?userId={{userId}}" \
              -H "Authorization: bearer YOUR_API_KEY" \
              -H "x-api-version: 2025-09"
        - lang: Python
          source: |
            import requests

            url = "https://production.runalloy.com/workflows"
            params = {"userId": "{{userId}}"}
            headers = {
                "Authorization": "bearer YOUR_API_KEY",
                "x-api-version": "2025-09"
            }

            response = requests.get(url, params=params, headers=headers)
            print(response.json())
        - lang: JavaScript
          source: |
            const userId = "{{userId}}";
            const url = `https://production.runalloy.com/workflows?userId=${userId}`;

            fetch(url, {
              method: "GET",
              headers: {
                "Authorization": "bearer YOUR_API_KEY",
                "x-api-version": "2025-09"
              }
            })
              .then(response => response.json())
              .then(data => console.log(data))
              .catch(error => console.error("Error:", error));
        - lang: PHP
          source: |
            <?php
            $userId = "{{userId}}";
            $url = "https://production.runalloy.com/workflows?userId=" . urlencode($userId);
            
            $ch = curl_init($url);
            curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
            curl_setopt($ch, CURLOPT_HTTPHEADER, [
                "Authorization: bearer YOUR_API_KEY",
                "x-api-version: 2025-09"
            ]);
            
            $response = curl_exec($ch);
            curl_close($ch);
            $data = json_decode($response, true);
            print_r($data);
            ?>
        - lang: Go
          source: |
            package main

            import (
                "encoding/json"
                "fmt"
                "io"
                "net/http"
                "net/url"
            )

            func main() {
                userId := "{{userId}}"
                baseURL := "https://production.runalloy.com/workflows"
                params := url.Values{}
                params.Add("userId", userId)
                fullURL := baseURL + "?" + params.Encode()

                req, _ := http.NewRequest("GET", fullURL, nil)
                req.Header.Set("Authorization", "bearer YOUR_API_KEY")
                req.Header.Set("x-api-version", "2025-09")

                client := &http.Client{}
                resp, _ := client.Do(req)
                defer resp.Body.Close()

                body, _ := io.ReadAll(resp.Body)
                var data map[string]interface{}
                json.Unmarshal(body, &data)
                fmt.Println(data)
            }
        - lang: Java
          source: |
            import java.net.HttpURLConnection;
