        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: bearer YOUR_API_KEY
        - name: id
          in: path
          required: true
          description: The execution ID for which to retrieve logs.
          schema:
            type: string
            example: "68110fea7d181f356acd1bf1"
      responses:
        "200":
          description: Logs for the specified execution retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "68110fea7d181f356acd1bf1"
                      executionMode:
                        type: string
                        enum:
