      summary: Get All Integrations
      description: Retrieves all integrations available in the Alloy Embedded account.
      operationId: getAllIntegrations
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      responses:
        '200':
          description: Successful response with a list of integrations.
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                    - integrationId: 67120234ea0bb132f61455d3
                      description: ''
                      primaryConnector: Variable Selector
                      icon: https://cdn.runalloy.com/icons/shopify.png
                      workflows:
