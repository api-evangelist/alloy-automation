                            name:
                              type: string
                              example: Magento Order Sync
                            installed:
                              type: boolean
                              example: true
                              default: true
                            version:
                              type: integer
                              example: 1
                              default: 0
                            installedVersion:
                              type: integer
                              example: 1
                              default: 0
                            active:
                              type: boolean
                              example: true
