  /workflows/{workflowId}/errors:
    get:
      summary: Retrieve all error logs for a workflow
      description: 'Use this endpoint to get the error logs for a specific workflow.

        It returns the error message, and the date stamp when the error was thrown, the block that caused the error, and the `workflowId` . Commonly used to debug workflows when they error and identify historical errors; this endpoint may be used in conjunction with the route error messages feature.


        If there are no errors for the specified workflow, this endpoint will return an empty array.'
      operationId: get-workflow-errors
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      - name: workflowId
        in: path
        description: The Id of the workflow you want to find errors for
        schema:
          type: string
        required: true
      - name: userId
        in: query
        description: The Id of the user
        schema:
          type: string
      x-code-samples:
      - lang: cURL
        source: "curl -X GET \"https://production.runalloy.com/workflows/{workflowId}/errors?userId={{userId}}\" \\\n  -H \"Authorization: bearer YOUR_API_KEY\" \\\n  -H \"x-api-version: 2025-09\"\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://production.runalloy.com/workflows/{workflowId}/errors\"\nparams = {\"userId\": \"{{userId}}\"}\nheaders = {\n    \"Authorization\": \"bearer YOUR_API_KEY\",\n    \"x-api-version\": \"2025-09\"\n}\n\nresponse = requests.get(url, params=params, headers=headers)\nprint(response.json())\n"
