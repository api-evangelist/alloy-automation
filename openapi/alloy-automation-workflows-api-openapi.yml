openapi: 3.2.0
info:
  title: Embedded 2025-09 Workflows API
  version: '5.0'
servers:
- url: https://production.runalloy.com
tags:
- name: Workflows
paths:
  /workflows/install:
    post:
      summary: Install workflows
      description: Installs workflows for a specified user.
      operationId: install-workflows
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/xApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - workflowIds
              - credentialIds
              - userId
              properties:
                workflowIds:
                  type: array
                  items:
                    type: string
                credentialIds:
                  type: array
                  items:
                    type: string
                userId:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    installed: true
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                    example: true
                    default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: Could not install workflow(s)
      deprecated: false
      security: []
      tags:
      - Workflows
  /workflows:
    get:
      summary: Retrieve a list of workflows
      description: 'Returns a list of all active **parent** workflows associated with your Alloy Embedded account. Note this endpoint does _not_ return a list of workflows that the user has installed, but rather a list of all _available_ workflows. The `installed` flag indicates if the user has installed a copy of the workflow but does not indicate if the user has a given workflow "active".


        For each workflow, this endpoint returns the individual apps that are required as part of the workflow. Commonly used to populate data on an integrations page.'
      operationId: list-workflows
      parameters:
      - name: userId
        in: query
        description: 'The Id of the user you want to lookup. Returned from the Create User endpoint. Note: you can also use the Embedded user''s `username` in this field.'
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      x-code-samples:
      - lang: cURL
        source: "curl -X GET \"https://production.runalloy.com/workflows?userId={{userId}}\" \\\n  -H \"Authorization: bearer YOUR_API_KEY\" \\\n  -H \"x-api-version: 2025-09\"\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://production.runalloy.com/workflows\"\nparams = {\"userId\": \"{{userId}}\"}\nheaders = {\n    \"Authorization\": \"bearer YOUR_API_KEY\",\n    \"x-api-version\": \"2025-09\"\n}\n\nresponse = requests.get(url, params=params, headers=headers)\nprint(response.json())\n"
      - lang: JavaScript
        source: "const userId = \"{{userId}}\";\nconst url = `https://production.runalloy.com/workflows?userId=${userId}`;\n\nfetch(url, {\n  method: \"GET\",\n  headers: {\n    \"Authorization\": \"bearer YOUR_API_KEY\",\n    \"x-api-version\": \"2025-09\"\n  }\n})\n  .then(response => response.json())\n  .then(data => console.log(data))\n  .catch(error => console.error(\"Error:\", error));\n"
      - lang: PHP
        source: "<?php\n$userId = \"{{userId}}\";\n$url = \"https://production.runalloy.com/workflows?userId=\" . urlencode($userId);\n\n$ch = curl_init($url);\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\ncurl_setopt($ch, CURLOPT_HTTPHEADER, [\n    \"Authorization: bearer YOUR_API_KEY\",\n    \"x-api-version: 2025-09\"\n]);\n\n$response = curl_exec($ch);\ncurl_close($ch);\n$data = json_decode($response, true);\nprint_r($data);\n?>\n"
      - lang: Go
        source: "package main\n\nimport (\n    \"encoding/json\"\n    \"fmt\"\n    \"io\"\n    \"net/http\"\n    \"net/url\"\n)\n\nfunc main() {\n    userId := \"{{userId}}\"\n    baseURL := \"https://production.runalloy.com/workflows\"\n    params := url.Values{}\n    params.Add(\"userId\", userId)\n    fullURL := baseURL + \"?\" + params.Encode()\n\n    req, _ := http.NewRequest(\"GET\", fullURL, nil)\n    req.Header.Set(\"Authorization\", \"bearer YOUR_API_KEY\")\n    req.Header.Set(\"x-api-version\", \"2025-09\")\n\n    client := &http.Client{}\n    resp, _ := client.Do(req)\n    defer resp.Body.Close()\n\n    body, _ := io.ReadAll(resp.Body)\n    var data map[string]interface{}\n    json.Unmarshal(body, &data)\n    fmt.Println(data)\n}\n"
      - lang: Java
        source: "import java.net.HttpURLConnection;\nimport java.net.URL;\nimport java.io.BufferedReader;\nimport java.io.InputStreamReader;\nimport com.google.gson.Gson;\nimport java.util.Map;\n\npublic class Example {\n    public static void main(String[] args) throws Exception {\n        String userId = \"{{userId}}\";\n        String urlString = \"https://production.runalloy.com/workflows?userId=\" + java.net.URLEncoder.encode(userId, \"UTF-8\");\n        \n        URL url = new URL(urlString);\n        HttpURLConnection conn = (HttpURLConnection) url.openConnection();\n        conn.setRequestMethod(\"GET\");\n        conn.setRequestProperty(\"Authorization\", \"bearer YOUR_API_KEY\");\n        conn.setRequestProperty(\"x-api-version\", \"2025-09\");\n        \n        BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream()));\n        String inputLine;\n        StringBuilder response = new StringBuilder();\n        while ((inputLine = in.readLine()) != null) {\n            response.append(inputLine);\n        }\n        in.close();\n        \n        Gson gson = new Gson();\n        Map<String, Object> data = gson.fromJson(response.toString(), Map.class);\n        System.out.println(data);\n    }\n}\n"
      - lang: Ruby
        source: 'require ''net/http''

          require ''json''

          require ''uri''


          userId = "{{userId}}"

          uri = URI("https://production.runalloy.com/workflows")

          params = { userId: userId }

          uri.query = URI.encode_www_form(params)


          http = Net::HTTP.new(uri.host, uri.port)

          http.use_ssl = true


          request = Net::HTTP::Get.new(uri)

          request[''Authorization''] = ''bearer YOUR_API_KEY''

          request[''x-api-version''] = ''2025-09''


          response = http.request(request)

          data = JSON.parse(response.body)

          puts data

          '
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                    - workflowId: 6544eac8e1ee020334af4ec8
                      name: 'Untitled Workflow #595'
                      createdAt: '2023-11-03T12:42:48.304Z'
                      updatedAt: '2023-11-03T13:12:45.522Z'
                      installed: false
                      active: false
                      version: 1
                      integrationId: 6544193cd8c482b3fe875101
                      connectors:
                      - connectorName: KnoCommerce Trigger
                        connectorId: 3fe19002-a854-466a-b1c7-682d6fbe398a
                        connector: knoCommerceTrigger
                        icon: https://cdn.runalloy.com/icons/knoCommerce.png
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      tags:
      - Workflows
  /workflows/deactivate:
    put:
      summary: Deactivate a workflow
      description: 'Disables all future invocations and runs for a given workflow.


        By deactivating a workflow, this endpoint will turn off any events or webhooks a workflow is subscribed to. May be reactivated by the Reactivate workflow endpoint.'
      operationId: deactivate-a-workflow
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: string
                  description: 'The Id of the user you want to lookup. Returned from the Create User endpoint. Note: you can also use the Embedded user''s `username` in this field.'
                workflowId:
                  type: string
                  description: The Id of the workflow to activate. If you pass this parameter, then `workflowName` is not required.
                workflowName:
                  type: string
                  description: The name of the workflow to activate.  If you pass this parameter, then `workflowId` is not required.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    activated: false
              schema:
                type: object
                properties:
                  activated:
                    type: boolean
                    example: false
                    default: true
      deprecated: false
      security: []
      tags:
      - Workflows
  /workflows/activate:
    put:
      summary: Activate workflow for a user
      description: Reactivates a workflow that was previously disabled by the Disable Workflow endpoint. This endpoint requires a specified WorkflowId and returns a success/failure.
      operationId: activate-a-workflow
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: string
                  description: 'The Id of the user you want to lookup. Returned from the Create User endpoint. Note: you can also use the Embedded user''s `username` in this field.'
                workflowName:
                  type: string
                  description: The name of the workflow to activate.  If you pass this parameter, then `workflowId` is not required.
                workflowId:
                  type: string
                  description: The Id of the workflow to activate. If you pass this parameter, then `workflowName` is not required.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    activated: true
              schema:
                type: object
                properties:
                  activated:
                    type: boolean
                    example: true
                    default: true
      deprecated: false
      security: []
      tags:
      - Workflows
  /workflows/{workflowId}/analytics:
    get:
      summary: Retrieve usage metrics for a workflow
      description: This endpoint returns the `totalAppActions` (the number of times each block inside the workflow has been executed over the course of the workflow's lifetime), the `totalWorkflowRuns` (which represents the number of times the workflow has been invoked) and the `totalErrors` (the number of times the workflow has had an error).
      operationId: get-workflow-analytics
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      - name: workflowId
        in: path
        description: The Id of the workflow you want to find errors for
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    totalAppActions: 14
                    totalWorkflowRuns: 14
                    totalErrors: 0
              schema:
                type: object
                properties:
                  totalAppActions:
                    type: integer
                    example: 14
                    default: 0
                  totalWorkflowRuns:
                    type: integer
                    example: 14
                    default: 0
                  totalErrors:
                    type: integer
                    example: 0
                    default: 0
      deprecated: false
      security: []
      tags:
      - Workflows
  /workflows/{workflowId}/logs:
    get:
      summary: Retrieve logs for a single workflow
      description: 'Retrieves log data for a given workflow.

        Each log includes the `executionId` (which can be used to rerun an execution), the `startedAt` and `stoppedAt` date stamps, and the JSON output of the execution.'
      operationId: get-workflow-logs
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      - name: workflowId
        in: path
        description: The Id of the git workflow you want to find logs for
        schema:
          type: string
        required: true
      - name: userId
        in: query
        description: The Id of the user you want delete logs for. Returned from the Create User endpoint
        schema:
          type: string
      - name: page
        in: query
        description: page of results
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Number of results per page (max 30, default 10)
        schema:
          type: integer
          format: int32
      - name: order
        in: query
        description: asc or desc for ascending/descending (default desc)
        schema:
          type: string
