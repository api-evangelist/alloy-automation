openapi: 3.2.0
info:
  title: Embedded 2025-09 Analytics API
  version: '5.0'
servers:
- url: https://production.runalloy.com
tags:
- name: Analytics
paths:
  /analytics/usage:
    get:
      summary: Get Analytics Usage
      description: Returns a list of all app actions usage data.
      operationId: get-app-actions-usage
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      responses:
        '200':
          description: Success (Example)
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                      startDate: '2023-12-27'
                      endDate: '2024-12-26'
                      executionsLimit: 0
                      sevenDays: 14
                      thirtyDays: 90
                      lastThreeMonths: 1300
                      billingCycle: 2096
                      appActions: 2096
                      apiActions: 0
      tags:
      - Analytics
  /analytics/detail-usage-time:
    get:
      summary: Get Analytics Detailed Usage Time
      description: Returns app actions usage based on a given time period.
      operationId: get-detail-usage-time
      parameters:
      - name: timePeriod
        in: query
        required: false
        description: The time period for usage data. Default time-period is `current-billing-cycle`
        schema:
          type: string
          example: 7-days
          enum:
          - 7-days
          - 30-days
          - 3-months
          - current-billing-cycle
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      responses:
        '200':
          description: Success (Example)
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                      startDate: '2023-12-27'
                      endDate: '2024-12-27'
