  /analytics/detail-usage-user:
    get:
      summary: Get Analytics Detailed Usage By User
      description: Retrieves usage data for a specific user.
      operationId: get-detail-usage-user
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      - name: userId
        in: query
        required: true
        description: The ID of the user.
        schema:
          type: string
          example: y66wqtzdeu94q5xawwjxc
      - name: timePeriod
        in: query
        required: false
        description: The time period for usage data.
        schema:
          type: string
          enum:
          - 7-days
          - 30-days
          - 3-months
          - current-billing-cycle
          example: 7-days
      x-code-samples:
      - lang: cURL
        source: "curl -X GET \"https://production.runalloy.com/analytics/detail-usage-user?userId={{userId}}\" \\\n  -H \"Authorization: bearer YOUR_API_KEY\" \\\n  -H \"x-api-version: 2025-09\"\n"
