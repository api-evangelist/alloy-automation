  /analytics/detail-usage-integration:
    get:
      summary: Get Analytics Detailed Usage By Integration
      description: Returns usage data for a specific integration.
      operationId: get-detail-usage-integration
      parameters:
      - name: timePeriod
        in: query
        required: false
        description: The time period for usage data.
        schema:
          type: string
          enum:
          - 7-days
          - 30-days
          - 3-months
          - current-billing-cycle
          example: 7-days
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - $ref: '#/components/parameters/xApiVersion'
      - name: integrationId
        in: query
        required: true
        description: The ID of the integration.
        schema:
          type: string
          example: 66fabcb533a7e961c65fad51
      responses:
        '200':
          description: Success (Example)
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                      integrationName: Variable Selector
                      integrationId: 673dc357c2f5556954bd4b45
                      integrationCreatedDate: '2024-11-20T11:09:11.090Z'
