      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: bearer YOUR_API_KEY
      - name: credentialId
        in: query
        required: true
        description: The credentialId for this integration.
        schema:
          type: string
      - $ref: '#/components/parameters/xApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  example: GET
                path:
                  type: string
                  example: /some/path
                body:
                  type:
                  - object
                  - 'null'
                query:
                  type:
                  - object
                  - 'null'
                extraHeaders:
                  type:
                  - object
                  - 'null'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      security: []
      tags:
      - Passthrough
