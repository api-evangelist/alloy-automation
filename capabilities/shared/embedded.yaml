name: Embedded
description: Shared capability definition for Alloy Embedded API operations
version: 2025-09
base_url: https://embedded.runalloy.com/2025-09
auth:
  type: bearer
  header: Authorization
operations:
  - id: createUser
    method: POST
    path: /users
    summary: Create a new end user
  - id: generateUserToken
    method: GET
    path: /users/{userId}/token
    summary: Generate JWT for user frontend authentication
  - id: deleteUserLogs
    method: DELETE
    path: /users/{userId}/logs
    summary: Purge user logs for compliance
  - id: listIntegrations
    method: GET
    path: /integrations
    summary: List available integrations for a user
  - id: triggerEvent
    method: POST
    path: /run/event
    summary: Trigger a custom workflow event
  - id: listWorkflowErrors
    method: GET
    path: /workflows/{workflowId}/errors
    summary: List workflow execution errors
  - id: listWorkflowLogs
    method: GET
    path: /workflows/{workflowId}/logs
    summary: List workflow execution logs
  - id: deactivateWorkflow
    method: PUT
    path: /workflows/deactivate
    summary: Disable a workflow for a user
  - id: activateWorkflow
    method: PUT
    path: /workflows/activate
    summary: Re-enable a workflow for a user
  - id: upgradeWorkflow
    method: PUT
    path: /workflows/{workflowId}/upgrade
    summary: Upgrade a user's workflow to a new version
rest_port: 8101
mcp_port: 9101
