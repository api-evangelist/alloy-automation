apis:
  - aid: alloy-automation:connectivity-api
    name: Alloy Automation Connectivity API
    description: >-
      The Connectivity API from Alloy Automation embeds native integrations via a
      single endpoint, providing a standardized and scalable way to build
      third-party integrations directly into your product without writing custom
      logic for every app.
    humanURL: https://runalloy.com/platform/connectivity-api/
    tags:
      - Connectivity
      - Integrations
      - Unified API
    properties:
      - type: Documentation
        url: https://docs.runalloy.com/
      - type: OpenAPI
        url: https://docs.runalloy.com/
  - aid: alloy-automation:unified-api
    name: Alloy Automation Unified API
    description: >-
      The Alloy Unified API enables companies to accomplish access-based app
      integrations across commerce, CRM, ERP, and other categories through a
      single standardized interface.
    humanURL: https://docs.runalloy.com/unified-api/1.0.0/getting-started/quick-start/
    tags:
      - Commerce
      - CRM
      - ERP
      - Unified API
    properties:
      - type: Documentation
        url: https://docs.runalloy.com/unified-api/1.0.0/getting-started/quick-start/
  - aid: alloy-automation:embedded
    name: Alloy Automation Embedded
    description: >-
      Alloy Embedded turns integration requests into marketplace offerings,
      handling infrastructure from auth to deployment to observability so teams
      can focus on building core product functionality.
    humanURL: https://runalloy.com/platform/embedded/
    tags:
      - Embedded
