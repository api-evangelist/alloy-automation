apis:
  - aid: alloy-automation:embedded-api
    name: Alloy Automation Embedded API
    description: >-
      The Alloy Embedded API enables SaaS companies to embed native integration
      workflows directly in their products. Manage end users, retrieve available
      integrations, trigger events, monitor workflow execution, and control workflow
      lifecycle for your embedded iPaaS experience.
    humanURL: https://docs.runalloy.com/embedded/quick-start
    baseURL: https://embedded.runalloy.com/2025-09
    tags:
      - Embedded
      - iPaaS
      - Workflows
      - Users
    properties:
      - type: Documentation
        url: https://docs.runalloy.com/embedded/quick-start
      - type: OpenAPI
        url: openapi/alloy-automation-embedded.yaml
      - type: JSONSchema
        url: json-schema/alloy-embedded-user-schema.json
      - type: JSONStructure
        url: json-structure/alloy-embedded-user-structure.json
      - type: JSONLD
        url: json-ld/alloy-automation-embedded-context.jsonld
      - type: Example
        url: examples/alloy-embedded-user-example.json
      - type: NaftikoCapability
        url: capabilities/shared/embedded.yaml

  - aid: alloy-automation:connectivity-api
    name: Alloy Automation Connectivity API
    description: >-
      The Alloy Connectivity API enables companies to build native integration UIs
      with a single API endpoint. Manage users, discover connector resources, configure
      credentials, and execute connector actions across 1000+ third-party applications.
    humanURL: https://docs.runalloy.com/connectivity-api/quick-start
    baseURL: https://production.runalloy.com
    tags:
      - Connectivity
      - Integrations
      - Unified API
      - Connectors
    properties:
