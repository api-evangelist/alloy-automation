aid: alloy-automation
url: https://raw.githubusercontent.com/api-evangelist/alloy-automation/refs/heads/main/apis.yml
name: Alloy Automation
kind: company
description: Alloy Automation (runalloy.com) is an embedded integration platform (iPaaS)
  and Unified API for SaaS products. Its Embedded product lets you drop white-labeled,
  end-user-facing integrations into your app, while the Connectivity and Unified API
  provide a single REST interface for connecting to hundreds of third-party platforms
  across commerce, CRM, and accounting. All APIs use dated versioning (2024-03), a
  Bearer API key, and per-user credentials/tokens.
