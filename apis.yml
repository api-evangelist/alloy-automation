  - type: Features
    data:
      - name: Embedded iPaaS
        description: >-
          Drag-and-drop orchestration platform for shipping native integrations
          directly in your SaaS product, handling auth, deployment, and observability.
      - name: Connectivity API
        description: >-
          Single endpoint to access 1000+ third-party app connectors with built-in
          credential management, resource discovery, and real-time action execution.
      - name: MCP Server
        description: >-
          Model Context Protocol server providing AI agents secure, remote-hosted
          access to 1000+ tools with built-in context, permissioning, and authentication.
      - name: Workflow Builder
        description: >-
          Visual workflow builder with logic blocks (Branch, If-Else, Iterate,
          Error Handler) and data transformation for building complex automation flows.
      - name: Installation Manager
        description: >-
          Self-service integration marketplace experience enabling end users to
          discover, install, and configure integrations within your product.
      - name: Custom Connectors
        description: >-
          Build custom connectors for proprietary or internal APIs using Alloy's
          connector framework with custom OAuth and authentication handling.
      - name: Webhook Support
        description: >-
          Custom event triggers and webhook destinations for real-time integration
          workflows responding to external events.
      - name: Compliance Controls
        description: >-
          GDPR, CCPA, HIPAA, and SOC 2 compliance with user data purging, static
          IP addresses, encryption, and SSO/SAML support.
  - type: UseCases
    data:
      - name: Native Integration Marketplace
        description: >-
          Embed a branded integration marketplace in your SaaS product allowing
          customers to self-serve connections to Shopify, Salesforce, NetSuite, and 1000+ apps.
      - name: AI Agent Integration
        description: >-
          Connect LLM-powered AI agents to third-party business applications using
          the Alloy MCP server with Claude, LangChain, and Vercel AI SDK.
      - name: E-Commerce Automation
        description: >-
          Automate order management, returns, 3PL fulfillment, and inventory sync
          across Shopify, BigCommerce, WooCommerce, and marketplace platforms.
      - name: Accounting Integration
        description: >-
          Sync general ledger entries, invoices, and journal entries between your
          platform and QuickBooks, NetSuite, Xero, and SAP.
  - type: Integrations
    data:
      - name: Shopify
        description: E-commerce order management, product catalog, and customer data integration
      - name: Salesforce
        description: CRM contact, opportunity, and account sync integration
      - name: QuickBooks
        description: Accounting GL sync, invoice creation, and payment reconciliation
      - name: HubSpot
        description: CRM and marketing automation contact and deal sync
      - name: Claude
        description: Anthropic Claude AI agent integration via Alloy MCP server
      - name: LangChain
        description: LangChain AI agent integration using Alloy MCP tools
      - name: Vercel AI SDK
        description: Vercel AI SDK integration for building AI-powered workflows
