aid: alloy-automation
name: Alloy Automation
description: >-
  Alloy Automation is the all-in-one integration infrastructure platform for
  SaaS and AI, offering embedded iPaaS, unified API, and connectivity API
  products that let companies launch native integrations, build workflows, and
  connect to 1000+ apps with a single endpoint.
