      - type: Example
        url: examples/alloy-connectivity-connector-example.json
      - type: NaftikoCapability
        url: capabilities/shared/connectivity.yaml

  - aid: alloy-automation:unified-api
    name: Alloy Automation Unified API
    description: >-
      The Alloy Unified API enables companies to accomplish access-based app
      integrations across commerce, CRM, ERP, and other categories through a
      single standardized interface.
