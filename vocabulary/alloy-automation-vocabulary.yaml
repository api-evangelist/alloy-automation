name: Alloy Automation Vocabulary
description: Controlled vocabulary for Alloy Automation integration platform concepts
version: 1.0.0
resources:
  - name: User
    description: An end user in the Alloy platform who owns integrations and credentials
    properties:
      - userId
      - username
      - fullName
      - createdAt
  - name: Integration
    description: A third-party application integration available to be installed by a user
    properties:
      - integrationId
      - name
      - category
      - iconUrl
      - installed
  - name: Connector
    description: A third-party application that can be connected via the Connectivity API
    properties:
      - connectorId
      - name
      - category
      - iconUrl
      - actionCount
  - name: Credential
    description: Stored authentication credentials for a user's connector connection
    properties:
      - credentialId
      - connectorId
      - userId
      - createdAt
  - name: Workflow
    description: An automated integration workflow that runs on behalf of a user
    properties:
      - workflowId
      - status
      - version
  - name: WorkflowLog
    description: A record of a workflow execution event
    properties:
      - logId
      - workflowId
      - status
      - executedAt
      - duration
  - name: ConnectorAction
    description: A specific operation available for a third-party connector
    properties:
      - actionId
      - name
      - description
      - parameters
actions:
  - name: Create User
    description: Register a new end user in the Alloy platform
    http_method: POST
    path_pattern: /users
  - name: Generate Token
    description: Issue a short-lived JWT for frontend SDK authentication
    http_method: GET
    path_pattern: /users/{userId}/token
  - name: Trigger Event
    description: Fire a custom event to start or resume a workflow
    http_method: POST
    path_pattern: /run/event
  - name: Execute Action
    description: Run a connector action using stored credentials
    http_method: POST
    path_pattern: /connectors/{connectorId}/actions/{actionId}/execute
  - name: Create Credential
    description: Store connector authentication credentials for a user
    http_method: POST
    path_pattern: /connectors/{connectorId}/credentials
enumerations:
  workflowStatus:
    description: Execution status values for workflows
    values:
      - value: success
        description: Workflow executed without errors
      - value: failure
        description: Workflow execution failed
      - value: pending
        description: Workflow is queued or in progress
  authType:
    description: Authentication types supported by connectors
    values:
      - value: oauth2
        description: OAuth 2.0 authorization code or client credentials flow
      - value: api_key
        description: Simple API key passed in headers or query parameters
      - value: basic
        description: HTTP Basic Authentication with username and password
  connectorCategory:
    description: Categories of third-party application connectors
    values:
      - value: E-Commerce
        description: Online store and marketplace platforms
      - value: CRM
        description: Customer relationship management platforms
      - value: ERP
        description: Enterprise resource planning and accounting platforms
      - value: Marketing
        description: Email marketing and campaign management platforms
      - value: Shipping
        description: Shipping, logistics, and fulfillment platforms
      - value: Communication
        description: Messaging, email, and collaboration platforms
workflows:
  - name: User Onboarding
    description: Register a user and configure their first integration
    steps:
      - Create user via POST /users
      - Generate JWT via GET /users/{userId}/token
      - Render integration modal using SDK with JWT
  - name: Connector Action Execution
    description: Execute a third-party connector action for a user
    steps:
      - Discover connectors via GET /connectors
      - Get action schema via GET /connectors/{connectorId}/actions/{actionId}
      - Create credential via POST /connectors/{connectorId}/credentials
      - Execute action via POST /connectors/{connectorId}/actions/{actionId}/execute
personas:
  - name: SaaS Product Manager
    description: Product leader building native integration features for their platform
  - name: Integration Developer
    description: Developer implementing Alloy Embedded or Connectivity API in a product
  - name: End User
    description: Customer of a SaaS platform using native integrations powered by Alloy
  - name: AI Agent Developer
    description: Developer building LLM-powered agents using Alloy MCP server tools
